<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Rewrite V3 · the ink-wash scroll</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<canvas id="scene" aria-label="Ink-wash landscape of a walled river city"></canvas>
<canvas id="ghost" class="ghost" aria-hidden="true"></canvas>
<div id="vignette"></div>
<div class="roller left"><i></i></div>
<div class="roller right"><i></i></div>

<section id="slip" data-echo="false" aria-label="The written fact">
  <div class="cord"></div>
  <div class="card" id="card">
    <p class="zh" lang="zh">
      <span id="zhOld">灰堡市建于永昌四十二年。</span>
      <span id="zhNew">灰堡市从未建立。</span>
      <span id="zhNote">他记得永昌四十二年。</span>
    </p>
    <canvas id="strike"></canvas>
  </div>
  <div class="en">
    <p id="enOld">City of Ashmere founded in year 42.</p>
    <p id="enNew">City of Ashmere was never founded.</p>
    <p id="enNote">He remembers year 42.</p>
  </div>
</section>

<div id="brush" aria-hidden="true"><i class="shaft"></i><i class="ferrule"></i><i class="hair"></i></div>

<nav id="dock" data-echo="false" aria-label="Controls">
  <button id="holdBtn" type="button">Hold to rewrite <kbd>Space</kbd></button>
  <button id="compareBtn" type="button" aria-pressed="false">Hold to compare <kbd>C</kbd></button>
  <button id="undoBtn" type="button">Undo <kbd>Z</kbd></button>
  <label class="scrub">Painting <input id="scrub" type="range" min="0" max="1" step="0.01" value="0" aria-label="Rewrite progress"></label>
  <button id="reduceBtn" type="button" aria-pressed="false">Reduced motion: off</button>
  <span id="status" role="status">The city stands. Hold Space to strike the line.</span>
</nav>

<script src="core.js"></script>
<script src="paint.js"></script>
<script src="app.js"></script>
</body>
</html>
